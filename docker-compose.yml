version: '3.8'

services:

  # ── Backend Node.js ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./data/seprisa.db:/app/server/seprisa.db   # base de datos persistente
      - ./data/uploads:/app/server/uploads          # imágenes persistentes
    environment:
      NODE_ENV: production
      PORT: 3001

  # ── Frontend nginx ───────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "8080:80"          # host:8080 → contenedor:80
    depends_on:
      - api
